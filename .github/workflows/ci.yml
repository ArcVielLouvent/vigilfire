name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check all Python files
        run: python -m py_compile $(find . -name "*.py" -not -path "./.git/*")

      - name: Run unit tests (network-free, smoke tests skipped by default)
        run: pytest -v

  smoke-test:
    # Manual-trigger only: hits the real NASA APIs, so it's not run on every
    # push to avoid rate-limit noise. Requires a FIRMS_MAP_KEY repo secret
    # (Settings -> Secrets and variables -> Actions -> New repository secret).
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests against real NASA APIs
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: pytest -m smoke -v
